<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQLi Detection Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="shell">
        <header class="header">
            <div class="logo-row">
                <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <div class="logo-text">INJECT<span>GUARD</span></div>
            </div>
            <p class="tagline">Neural SQL Injection Detection Engine v1.0</p>
        </header>

        <main>
            <div class="scanner-card">
                <div class="card-header">
                    <div class="dot active"></div>
                    <span class="card-title">Analysis Laboratory</span>
                </div>
                
                <div class="input-zone">
                    <div class="input-wrap">
                        <textarea id="scanInput" placeholder="Enter SQL payload to analyze..."></textarea>
                        <div class="char-count">UTF-8 RAW</div>
                    </div>
                    
                    <div class="btn-row">
                        <button id="scanBtn" class="btn-scan">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                            Run Analysis
                        </button>
                        <button id="clearBtn" class="btn-clear">Clear</button>
                    </div>

                    <div class="examples-row">
                        <span class="ex-label">Presets:</span>
                        <div id="payloadPresets" style="display: contents;"></div>
                    </div>
                </div>
            </div>

            <div id="loadingState" class="loader hidden">
                <div class="l-dot"></div>
                <div class="l-dot"></div>
                <div class="l-dot"></div>
            </div>

            <div id="resultContainer">
                <!-- Results will be injected here by app.js -->
            </div>

            <div class="history-section">
                <div class="status-bar">
                    <span>HISTORY LOG</span>
                    <span class="sep">|</span>
                    <span id="historyCount">0 SESSION ENTRIES</span>
                </div>
                <ul id="historyList" style="list-style: none; padding-top: 10px;"></ul>
            </div>
        </main>
    </div>

    <script src="payloads.js"></script>
    <script src="history.js"></script>
    <script src="app.js"></script>
</body>
</html>
